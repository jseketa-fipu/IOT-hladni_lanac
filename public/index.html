<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pico-sim</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>pico-sim</h1>
      <select id="firmware" aria-label="Firmware">
        <option value="RPI_PICO_W-20231227-v1.22.0.uf2">Pico W · MicroPython 1.22.0</option>
        <option value="RPI_PICO-20231227-v1.22.0.uf2">Pico · MicroPython 1.22.0</option>
      </select>
      <button id="run" class="primary" title="Ctrl+Enter">▶ Run</button>
      <button id="stop" disabled>■ Stop</button>
      <label class="speed" title="How fast simulated time runs. The program and its timing are the same at every speed; 10× lets you see a 2-minute alarm in about 12 seconds.">
        Speed
        <select id="speed" aria-label="Simulation speed">
          <option value="1">1× real time</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
          <option value="20">20×</option>
          <option value="1000">Max</option>
        </select>
      </label>
      <span id="status" class="status" role="status" data-state="idle">Ready</span>
    </header>

    <main>
      <section class="code">
        <nav id="tabs"></nav>
        <textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea>
        <p class="hint">Edits here are local to this tab. Commit to the repo to change what everyone sees.</p>
      </section>

      <section class="board">
        <h2>Circuit <span class="sub">from diagram.json · click and hold the button to press it · click a part to set it up</span></h2>
        <div id="circuit" class="circuit"></div>
        <div class="section-head">
          <h2>Serial monitor</h2>
          <label class="check small" title="Keep the newest output in view"><input id="serial-follow" type="checkbox" checked /> auto-scroll</label>
          <button id="serial-copy" type="button" class="small-btn">Copy</button>
          <button id="serial-clear" type="button" class="small-btn">Clear</button>
        </div>
        <pre id="serial" class="serial empty">Press ▶ Run to start the Pico. Its output appears here.</pre>
        <input id="serial-input" class="serial-input" placeholder="Type and press Enter · Ctrl+C interrupts" disabled />
      </section>

      <section class="parts">
        <h2>Parts <span class="sub">set before or during Run</span></h2>
        <div id="controls" class="controls"></div>
      </section>
    </main>

    <dialog id="file-view" class="file-view">
      <header>
        <strong id="file-view-title"></strong>
        <button id="file-view-download" type="button">Download</button>
        <form method="dialog"><button>Close</button></form>
      </header>
      <pre id="file-view-body"></pre>
    </dialog>
  </body>
</html>
